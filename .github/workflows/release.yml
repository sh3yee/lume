name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要创建的版本标签，例如 v0.1.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
            rust-targets: ''
            args: --bundles msi,nsis
          - platform: macOS (Apple Silicon)
            os: macos-latest
            rust-targets: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macOS (Intel)
            os: macos-15-intel
            rust-targets: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: Linux
            os: ubuntu-22.04
            rust-targets: ''
            args: ''

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare signed updater configuration
        id: updater-config
        shell: pwsh
        env:
          LUME_UPDATER_PUBLIC_KEY: ${{ vars.LUME_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:LUME_UPDATER_PUBLIC_KEY) -or
              [string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw '请先配置 LUME_UPDATER_PUBLIC_KEY 仓库变量和 TAURI_SIGNING_PRIVATE_KEY 仓库 Secret，参见 docs/online-updates.zh-CN.md。'
          }
          $config = @{
            bundle = @{ createUpdaterArtifacts = $true }
            plugins = @{ updater = @{ pubkey = $env:LUME_UPDATER_PUBLIC_KEY.Trim() } }
          }
          $configPath = Join-Path $env:RUNNER_TEMP 'lume-updater.json'
          $config | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $configPath -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "path=$configPath" -Encoding utf8

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Read release notes
        id: release-notes
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          $notesPath = Join-Path 'docs/releases' "$env:RELEASE_TAG.md"
          $notes = if (Test-Path -LiteralPath $notesPath) {
            Get-Content -LiteralPath $notesPath -Raw -Encoding utf8
          } else {
            "此版本由 GitHub Actions 自动构建。`n`n本项目采用 PolyForm Noncommercial License 1.0.0，仅允许非商业用途。"
          }
          $delimiter = [guid]::NewGuid().ToString()
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "body<<$delimiter`n$notes`n$delimiter" -Encoding utf8

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          releaseName: Lume ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          releaseBody: ${{ steps.release-notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }} --config "${{ steps.updater-config.outputs.path }}"

  publish:
    name: Publish complete release
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Verify updater manifest and publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern latest.json --dir $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw '无法下载更新清单。' }
          $manifest = Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'latest.json') -Raw | ConvertFrom-Json
          if ($manifest.version.TrimStart('v') -ne $env:RELEASE_TAG.TrimStart('v')) {
            throw '更新清单版本与发布标签不一致。'
          }
          foreach ($target in @('windows-x86_64', 'darwin-aarch64', 'darwin-x86_64', 'linux-x86_64')) {
            $packages = @($manifest.platforms.PSObject.Properties | Where-Object { $_.Name -eq $target -or $_.Name.StartsWith("$target-") })
            if ($packages.Count -eq 0) { throw "更新清单缺少平台：$target" }
            foreach ($package in $packages) {
              if ([string]::IsNullOrWhiteSpace($package.Value.signature) -or $package.Value.url -notlike 'https://*') {
                throw "平台更新包缺少签名或 HTTPS 下载地址：$($package.Name)"
              }
            }
          }
          $release = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json databaseId | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or !$release.databaseId) { throw '无法读取待发布的 Release。' }
          gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/releases/$($release.databaseId)" -F draft=false -f make_latest=true
          if ($LASTEXITCODE -ne 0) { throw '发布 Release 失败。' }
