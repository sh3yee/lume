name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要创建的版本标签，例如 v0.1.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
            rust-targets: ''
            args: --bundles msi,nsis
          - platform: macOS (Apple Silicon)
            os: macos-latest
            rust-targets: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macOS (Intel)
            os: macos-15-intel
            rust-targets: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: Linux
            os: ubuntu-22.04
            rust-targets: ''
            args: ''

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          releaseName: Lume ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          releaseBody: |
            ## Lume ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

            此版本由 GitHub Actions 自动构建。

            > 本项目采用 PolyForm Noncommercial License 1.0.0，仅允许非商业用途。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}