[package]
name = "lume"
version = "0.1.0"
description = "Lume - 面向个人创作与本地知识管理的桌面 Markdown 编辑器"
authors = ["Lume"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "lume_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[features]
# 默认特性
default = []
# 自定义协议特性
custom-protocol = ["tauri/custom-protocol"]
